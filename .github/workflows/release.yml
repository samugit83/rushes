# Tag-triggered release. The tag must match package.json's version: a release
# whose tag and manifest disagree is unresolvable afterwards.

name: release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci

      - name: the tag must match the manifest
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          rel=$(node -p "require('./skill-release.json').version")
          test "$tag" = "$pkg" || { echo "tag $tag != package.json $pkg"; exit 1; }
          test "$tag" = "$rel" || { echo "tag $tag != skill-release.json $rel"; exit 1; }

      - run: npm run type-check
      - run: node test/run.mjs unit
      - run: node test/run.mjs neutrality

      - name: provision ffmpeg and a browser
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npx playwright install --with-deps chromium

      - run: node test/run.mjs conformance
      - run: node test/run.mjs timing

      - name: build the payload
        run: |
          node scripts/stage-clean-skill.mjs dist/skill
          node scripts/write-deterministic-zip.mjs dist/skill "dist/rushes-${GITHUB_REF_NAME}.zip"
          sha256sum "dist/rushes-${GITHUB_REF_NAME}.zip" > "dist/rushes-${GITHUB_REF_NAME}.zip.sha256"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/rushes-*.zip
            dist/rushes-*.zip.sha256
